# Server + Redis + Postgres + Caddy (HTTPS) on one machine. Settings come from apps/server/.env
# (DOMAIN, TOKEN_SECRET, POSTGRES_PASSWORD); deploy.sh creates it. From the repo root:
#   docker compose -f apps/server/docker-compose.yml up -d --build
services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # Only Caddy talks to it from outside; 127.0.0.1 keeps it off the public internet.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://shaxmat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/shaxmat
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET}
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shaxmat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: shaxmat
    volumes:
      - pg-data:/var/lib/postgresql/data
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - server
volumes:
  redis-data:
  pg-data:
  caddy-data:

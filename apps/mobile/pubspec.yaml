name: shaxmat
description: "Global Challenge Chess: online chess, a Stockfish bot and two-player mode."
publish_to: 'none'

# versionName+versionCode; bump the number after + for every Play upload.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Lichess packages are pinned to tested versions.
  chessground: 10.3.0
  dartchess: 0.14.0
  multistockfish: 0.6.1
  shared_preferences: ^2.5.5
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

# Server + Redis + Postgres on one machine. From the repo root:
#   TOKEN_SECRET=$(openssl rand -hex 32) POSTGRES_PASSWORD=... docker compose -f apps/server/docker-compose.yml up -d --build
services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://shaxmat:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/shaxmat
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET}
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shaxmat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: shaxmat
    volumes:
      - pg-data:/var/lib/postgresql/data
volumes:
  redis-data:
  pg-data:
